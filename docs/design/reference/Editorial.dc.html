<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks, editorial light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17181B}a:hover{color:#5E636B}
input::placeholder{color:#7A7F87}
button:focus-visible,input:focus-visible{outline:2px solid #17181B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1000px; background: #F5F4F0; color: #17181B; font-family: 'IBM Plex Sans', system-ui, sans-serif; box-sizing: border-box; padding: 48px 20px 112px">
<div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5E636B">Task manager</span>
<div role="status" style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; background: #FFFFFF; border: 1px solid #DEDBD3; border-radius: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #17663A">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #23A55A"></span>
API up · uptime 1h 12m
</div>
</header>

<h1 style="margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1">{{heading}}</h1>

<form onSubmit="{{onCreate}}" noValidate="noValidate" style="display: flex; flex-direction: column; gap: 10px">
<label for="new-title" style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5E636B">New task</label>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<input id="new-title" type="text" placeholder="Type a task and press Enter" value="{{draft}}" onChange="{{onDraftChange}}" aria-invalid="{{draftInvalid}}" aria-describedby="new-title-error" style="flex: 1 1 300px; min-width: 0; height: 52px; padding: 0 16px; border: 1px solid #DEDBD3; border-radius: 12px; background: #FFFFFF; color: #17181B; font-family: inherit; font-size: 16px; box-sizing: border-box">
<button type="submit" style="height: 52px; padding: 0 22px; border: 0; border-radius: 12px; background: {{accent}}; color: #1A1300; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Add</button>
</div>
<sc-if value="{{hasDraftError}}" hint-placeholder-val="{{false}}">
<p id="new-title-error" style="margin: 0; font-size: 13px; color: #B42318">{{draftError}}</p>
</sc-if>
</form>

<div role="search" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
<div style="position: relative; flex: 1 1 240px; min-width: 0">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E636B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 14px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Filter tasks by title" placeholder="Filter by title" value="{{query}}" onChange="{{onQueryChange}}" style="width: 100%; height: 44px; padding: 0 14px 0 40px; border: 1px solid #DEDBD3; border-radius: 10px; background: #FFFFFF; color: #17181B; font-family: inherit; font-size: 15px; box-sizing: border-box">
</div>
<div role="group" aria-label="Status" style="display: inline-flex; gap: 4px; padding: 4px; background: #EAE7E0; border-radius: 10px">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 7px; background: {{p.bg}}; color: {{p.fg}}; box-shadow: {{p.shadow}}; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; cursor: pointer">{{p.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 28px">
<sc-for list="{{groups}}" as="group" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #5E636B">{{group.label}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{group.items}}" as="task" hint-placeholder-count="2">
<li style="background: #FFFFFF; border: 1px solid {{task.rowBorder}}; border-radius: 12px">
<sc-if value="{{task.isViewing}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 4px; padding: 6px">
<label style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
<input type="checkbox" checked="{{task.done}}" onChange="{{task.toggle}}" aria-label="{{task.checkLabel}}" style="width: 20px; height: 20px; margin: 0; accent-color: #17181B; cursor: pointer">
</label>
<span style="flex: 1 1 auto; min-width: 0; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; color: {{task.titleColor}}; text-decoration: {{task.titleDecoration}}">{{task.title}}</span>
<time dateTime="{{task.iso}}" style="flex: none; margin-right: 6px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #5E636B">{{task.time}}</time>
<button type="button" aria-label="{{task.editLabel}}" onClick="{{task.edit}}" style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #5E636B; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
</button>
<button type="button" aria-label="{{task.deleteLabel}}" onClick="{{task.remove}}" style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #5E636B; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg>
</button>
</div>
</sc-if>
<sc-if value="{{task.isEditing}}" hint-placeholder-val="{{false}}">
<form onSubmit="{{task.save}}" noValidate="noValidate" style="display: flex; flex-direction: column; gap: 8px; padding: 8px">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<input type="text" aria-label="Edit task title" value="{{task.editDraft}}" onChange="{{task.onEditChange}}" onKeyDown="{{task.onEditKeyDown}}" aria-invalid="{{task.editInvalid}}" style="flex: 1 1 260px; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid #DEDBD3; border-radius: 8px; background: #FFFFFF; color: #17181B; font-family: inherit; font-size: 16px; box-sizing: border-box">
<button type="submit" style="height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #17181B; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Save</button>
<button type="button" onClick="{{task.cancel}}" style="height: 44px; padding: 0 14px; border: 1px solid #DEDBD3; border-radius: 8px; background: transparent; color: #17181B; font-family: inherit; font-size: 15px; cursor: pointer">Cancel</button>
</div>
<sc-if value="{{task.hasEditError}}" hint-placeholder-val="{{false}}">
<p style="margin: 0 4px; font-size: 13px; color: #B42318">{{task.editError}}</p>
</sc-if>
<p style="margin: 0 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #5E636B">Enter to save · Esc to cancel</p>
</form>
</sc-if>
</li>
</sc-for>
</ul>
</section>
</sc-for>
</div>
</sc-if>

<sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 24px; border: 1px dashed #D3CFC6; border-radius: 12px; text-align: center">
<p style="margin: 0; font-size: 16px">No tasks match your filter.</p>
<button type="button" onClick="{{clearFilters}}" style="height: 44px; padding: 0 16px; border: 1px solid #DEDBD3; border-radius: 10px; background: #FFFFFF; color: #17181B; font-family: inherit; font-size: 15px; cursor: pointer">Clear filters</button>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 40px 24px; border: 1px dashed #D3CFC6; border-radius: 12px; text-align: center; font-size: 16px; color: #5E636B">No tasks yet — add your first one above.</div>
</sc-if>

</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 6px 6px 6px 18px; background: #17181B; color: #F5F4F0; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(23, 24, 27, 0.18)">
<span>Task deleted</span>
<button type="button" onClick="{{undo}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #F5A524; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; cursor: pointer">Undo</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#5ED3B4","#A9B8FF"]},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.toastTimer = null;
this.state = {
draft: '',
draftError: '',
query: '',
status: 'all',
editingId: null,
editDraft: '',
editError: '',
deleted: null,
tasks: [
{ id: 't5', title: 'Write the README', bucket: 'today', time: '09:30', iso: '2026-11-02T09:30:00Z', done: false },
{ id: 't4', title: 'Record a short demo of the deploy', bucket: 'today', time: '08:10', iso: '2026-11-02T08:10:00Z', done: false },
{ id: 't3', title: 'Set up the GitHub Actions deploy role', bucket: 'yesterday', time: '18:05', iso: '2026-11-01T18:05:00Z', done: false },
{ id: 't2', title: 'Add request-logging middleware', bucket: 'yesterday', time: '11:42', iso: '2026-11-01T11:42:00Z', done: true },
{ id: 't1', title: 'Sketch the DynamoDB key design', bucket: 'earlier', time: 'Oct 31', iso: '2026-10-31T16:20:00Z', done: true }
]
};
}

componentWillUnmount() {
clearTimeout(this.toastTimer);
}

validate(t) {
if (!t) return 'Title is required';
if (t.length > 200) return 'Title must be 200 characters or fewer';
return '';
}

create(e) {
e.preventDefault();
var t = this.state.draft.trim();
var err = this.validate(t);
if (err) { this.setState({ draftError: err }); return; }
var now = new Date();
var time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
var task = { id: 'n' + Date.now(), title: t, bucket: 'today', time: time, iso: now.toISOString(), done: false };
this.setState({ draft: '', draftError: '', tasks: [task].concat(this.state.tasks) });
}

remove(id) {
var idx = this.state.tasks.findIndex((t) => t.id === id);
if (idx < 0) return;
var next = this.state.tasks.slice();
var task = next.splice(idx, 1)[0];
clearTimeout(this.toastTimer);
this.toastTimer = setTimeout(() => this.setState({ deleted: null }), 6000);
this.setState({ tasks: next, deleted: { task: task, index: idx }, editingId: this.state.editingId === id ? null : this.state.editingId });
}

undo() {
var d = this.state.deleted;
if (!d) return;
clearTimeout(this.toastTimer);
var next = this.state.tasks.slice();
next.splice(Math.min(d.index, next.length), 0, d.task);
this.setState({ tasks: next, deleted: null });
}

toggle(id) {
this.setState({
tasks: this.state.tasks.map((x) => (x.id === id ? Object.assign({}, x, { done: !x.done }) : x))
});
}

saveEdit(id) {
var t = this.state.editDraft.trim();
var err = this.validate(t);
if (err) { this.setState({ editError: err }); return; }
this.setState({
tasks: this.state.tasks.map((x) => (x.id === id ? Object.assign({}, x, { title: t }) : x)),
editingId: null,
editError: ''
});
}

renderVals() {
var self = this;
var s = this.state;
var q = s.query.trim().toLowerCase();
var labels = { today: 'Today', yesterday: 'Yesterday', earlier: 'Earlier' };

var matches = s.tasks.filter((t) => {
if (s.status === 'open' && t.done) return false;
if (s.status === 'done' && !t.done) return false;
return !q || t.title.toLowerCase().indexOf(q) !== -1;
});

var decorate = (t) => {
var editing = s.editingId === t.id;
return {
title: t.title,
time: t.time,
iso: t.iso,
done: t.done,
checkLabel: (t.done ? 'Mark as not done: ' : 'Mark as done: ') + t.title,
titleColor: t.done ? '#5E636B' : '#17181B',
titleDecoration: t.done ? 'line-through' : 'none',
toggle: () => self.toggle(t.id),
isEditing: editing,
isViewing: !editing,
rowBorder: editing ? '#17181B' : '#E6E3DC',
editLabel: 'Edit ' + t.title,
deleteLabel: 'Delete ' + t.title,
editDraft: s.editDraft,
editError: s.editError,
hasEditError: editing && !!s.editError,
editInvalid: editing && s.editError ? 'true' : 'false',
edit: () => self.setState({ editingId: t.id, editDraft: t.title, editError: '' }),
remove: () => self.remove(t.id),
save: (e) => { e.preventDefault(); self.saveEdit(t.id); },
cancel: () => self.setState({ editingId: null, editError: '' }),
onEditChange: (e) => self.setState({ editDraft: e.target.value, editError: '' }),
onEditKeyDown: (e) => { if (e.key === 'Escape') self.setState({ editingId: null, editError: '' }); }
};
};

var groups = ['today', 'yesterday', 'earlier']
.map((b) => ({ label: labels[b], items: matches.filter((t) => t.bucket === b).map(decorate) }))
.filter((g) => g.items.length > 0);

var periods = [['all', 'All'], ['open', 'Open'], ['done', 'Done']].map((p) => {
var on = s.status === p[0];
return {
label: p[1],
pressed: on ? 'true' : 'false',
bg: on ? '#FFFFFF' : 'transparent',
fg: on ? '#17181B' : '#5E636B',
shadow: on ? '0 1px 2px rgba(23, 24, 27, 0.12)' : 'none',
pick: () => self.setState({ status: p[0] })
};
});

var total = s.tasks.length;
var openCount = s.tasks.filter((t) => !t.done).length;
var filtering = !!q || s.status !== 'all';
var heading = total === 0 ? 'No tasks yet'
: filtering ? matches.length + ' of ' + total + ' tasks'
: openCount === 0 ? 'All done'
: openCount === 1 ? '1 open task' : openCount + ' open tasks';

return {
accent: this.props.accent ?? '#F5A524',
heading: heading,
draft: s.draft,
draftError: s.draftError,
hasDraftError: !!s.draftError,
draftInvalid: s.draftError ? 'true' : 'false',
onDraftChange: (e) => self.setState({ draft: e.target.value, draftError: '' }),
onCreate: (e) => self.create(e),
query: s.query,
onQueryChange: (e) => self.setState({ query: e.target.value }),
periods: periods,
groups: groups,
hasResults: groups.length > 0,
noResults: total > 0 && groups.length === 0,
isEmpty: total === 0,
clearFilters: () => self.setState({ query: '', status: 'all' }),
showToast: !!s.deleted,
undo: () => self.undo()
};
}
}
</script>
</body>
</html>
